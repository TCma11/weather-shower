<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陈令瑜 的今日天气雷达 🌤️</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-soft: #64748b;
      --accent: #0284c7;
      --tag-bg: #e0f2fe;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      padding: 20px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px 24px;
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: var(--tag-bg);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
    }
    .city-badge {
      font-size: 0.86rem;
      color: var(--text-soft);
      font-weight: 500;
    }
    .greeting-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #0f172a;
    }
    .content-box {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #334155;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      white-space: pre-wrap;
    }
    .loading-pulse {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 12px;
      color: var(--text-soft);
      font-size: 0.88rem;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="tag"> 天气雷达</div>
      <div class="city-badge">📍 漳州</div>
    </div>

    <div class="greeting-title">
      哟，陈令瑜 ✌️
    </div>

    <div id="contentArea">
      <div class="loading-pulse">
        <div class="spinner"></div>
        <div>DeepSeek 正在检索天气与提醒...</div>
      </div>
    </div>

    <div class="footer-note" id="timeFoot">正在同步时间...</div>
  </div>

  <script>
    const CONFIG = {
      name: "陈令瑜",
      city: "漳州",
      key: "sk-d535d547bf40448693e794f7359f4824"
    };

    function getPeriod(hour) {
      if (hour >= 5 && hour < 9) return "早晨";
      if (hour >= 9 && hour < 12) return "上午";
      if (hour >= 12 && hour < 14) return "中午";
      if (hour >= 14 && hour < 18) return "下午";
      if (hour >= 18 && hour < 22) return "傍晚";
      return "大半夜";
    }

    async function loadCard() {
      const now = new Date();
      const period = getPeriod(now.getHours());
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const timeStr = `${now.getMonth() + 1}月${now.getDate()}日 ${period}`;
      document.getElementById('timeFoot').innerText = `${timeStr} · 摸鱼也要看天气 🕶️`;

      if (!CONFIG.key || CONFIG.key.includes("xxxx")) {
        document.getElementById('contentArea').innerHTML = `
          <div class="content-box">
            ${CONFIG.name}，${period}好啊！\n\n今天的气温整体很舒服，微风不燥。出门记得留意一下天色，该带伞带伞，平时多喝水少熬夜。\n\n今天搬砖/上课辛苦了，该摸鱼摸鱼，该干饭干饭，祝你今天顺顺利利，少遇到点离谱事！💪
          </div>
        `;
        return;
      }

      try {
        // 直接让 DeepSeek 作为 Agent 查询并统筹输出天气指标和日常提醒
        const prompt = `你是一个说话爽快、接地气、像铁哥们一样贴心的生活天气助手。
现在需要你为好友【${CONFIG.name}】生成一张今日天气与日常提醒卡片。

当前情境：
- 当前日期：${dateStr}，时段：${period}
- 所在城市：【${CONFIG.city}】

任务要求：
1. **天气情况播报**：请给出【${CONFIG.city}】此时此刻的最新天气情况（包含大概的气温、体感、空气湿度以及今天是否会下雨/带伞提示）。
2. **好友式元气问候**：
   - 称呼【${CONFIG.name}】。
   - 绝对不要油腻、暧昧或情侣腔，完全是铁哥们/好闺蜜之间的自然调侃与爽朗问候（比如调侃一下下课/搬砖、吃点好的、别被淋成落汤鸡等）。
   - 顺带结合当前天气给出简短实用的穿衣或出行建议。
3. **篇幅格式**：整体控制在 120-150 字左右，分段干净清爽，读起来非常舒服。`;

        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CONFIG.key}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: 'You are a frank, witty, reliable personal assistant and good friend.' },
              { role: 'user', content: prompt }
            ],
            temperature: 0.7
          })
        });

        const resJson = await response.json();
        if (resJson.choices && resJson.choices[0]) {
          const reply = resJson.choices[0].message.content;
          document.getElementById('contentArea').innerHTML = `<div class="content-box">${reply}</div>`;
        } else {
          throw new Error('未获取到有效回复');
        }
      } catch (err) {
        document.getElementById('contentArea').innerHTML = `
          <div class="content-box">
            ${CONFIG.name}，${period}好啊！\n\n给你播报下，今天${CONFIG.city}温度整体适宜，微风刚好。出门留意下天色，防晒随缘，记得带把晴雨伞备用。\n\n今天学习/搬砖别太紧绷，该摸鱼摸鱼，该干饭干饭，祝你今天开开心心，少碰见离谱事！💪
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadCard);
  </script>
</body>
</html>
